<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 186" width="620" height="186" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2733"><text x="300" y="27.4" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400">Жители ПНИ (2024)</text><rect x="310" y="12" width="209.2" height="22" rx="3" fill="#2f5d8a"/><text x="527.25" y="27.4" font-size="12" text-anchor="start" fill="#1d2733" font-weight="600">139,5</text><text x="300" y="61.4" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400">Потенциал перехода по Минтруду, до 45 %</text><rect x="310" y="46" width="94.2" height="22" rx="3" fill="#9db4cc"/><text x="412.2" y="61.4" font-size="12" text-anchor="start" fill="#1d2733" font-weight="600">≈63</text><text x="300" y="95.4" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400">«Сопровождаемое проживание» по Минтруду (2024)</text><rect x="310" y="80" width="10.5" height="22" rx="3" fill="#2a8c82"/><text x="328.5" y="95.4" font-size="12" text-anchor="start" fill="#1d2733" font-weight="600">7,0</text><text x="300" y="129.4" font-size="12" text-anchor="end" fill="#1d2733" font-weight="400">Постоянное проживание в квартирах (оценка)</text><rect x="310" y="114" width="2.7" height="22" rx="3" fill="#d08a1f"/><text x="320.7" y="129.4" font-size="12" text-anchor="start" fill="#1d2733" font-weight="600">1,8</text><text x="310" y="180" font-size="10.5" text-anchor="start" fill="#6b7785" font-weight="400">Тысяч человек. «Если быть точным», Минтруд. 62,8 — расчёт: 45 % × 139,5 тыс.</text></svg>